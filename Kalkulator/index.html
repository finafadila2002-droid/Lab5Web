<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project - Kalkulator Nilai</title>
</head>

<body>
    <div class="card">
        <h3>Kalkulator Nilai Mahasiswa</h3>
        <form id="formNilai">
            <label>Tugas (0-100)</label>
            <input type="number" id="tugas" placeholder="85" required>

            <label>UTS (0-100)</label>
            <input type="number" id="uts" placeholder="78" required>

            <label>UAS (0-100)</label>
            <input type="number" id="uas" placeholder="88" required>

            <button type="button" onclick="prosesNilai()">Hitung</button>

            <hr>
            <div id="hasil" style="font-weight:bold; font-size:18px; margin-top:10px;"></div>

            <script>
                function hitungNilaiAkhir(tugas, uts, uas) {
                    return tugas * 0.30 + uts * 0.30 + uas * 0.40;
                }
                function tentukanPredikat(nilai) {
                    if (nilai >= 85) return "A";
                    if (nilai >= 75) return "B";
                    if (nilai >= 60) return "C";
                    if (nilai >= 50) return "D";
                    return "E";
                }
                function prosesNilai() {
                    let tugas = parseFloat(document.getElementById("tugas").value);
                    let uts = parseFloat(document.getElementById("uts").value);
                    let uas = parseFloat(document.getElementById("uas").value);

                    if (tugas < 0 || tugas > 100 || uts < 0 || uts > 100 || uas < 0 || uas > 100) {
                        alert("Nilai harus 0-100!");
                        return;
                    }

                    let akhir = hitungNilaiAkhir(tugas, uts, uas);
                    let predikat = tentukanPredikat(akhir);
                    let status = akhir >= 60 ? "Lulus" : "Belum Lulus";

                    document.getElementById("hasil").innerHTML =
                        `Nilai Akhir : ${akhir.toFixed(2)} <br> Predikat : ${predikat} <br> Status : ${status}`;

                    console.log("Nilai Akhir:", akhir);
                }
            </script>
</body>

</html>
