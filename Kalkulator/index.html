<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini Project - Kalkulator Nilai</title>
</head>

<body>
    <div class="card">
        <h3>Kalkulator Nilai Mahasiswa</h3>
        <form id="formNilai">
            <label>Tugas (0-100)</label>
            <input type="number" id="tugas" placeholder="85" required>
            <label>UTS (0-100)</label>
            <input type="number" id="uts" placeholder="78" required>
            <label>UAS (0-100)</label>
            <input type="number" id="uas" placeholder="88" required>
            <button type="submit">Hitung</button>
        </form>
        <p id="hasil"></p>
        <script src="script.js"></script>
    </div>  
</body>

</html>
